<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="今日も無事に定時で帰れ。看護師の日常に降りかかる理不尽を体験する風刺系お仕事RPG。">

  <title>看護師クエスト</title>
</head>
<body>
  <script>
    window.kangoshiShareText = async function (text) {
      if (navigator.share) {
        try {
          await navigator.share({ text });
          return '共有しました';
        } catch (e) {
          if (e.name === 'AbortError') return '共有をキャンセルしました';
        }
      }
      try {
        await navigator.clipboard.writeText(text);
        return '共有テキストをコピーしました';
      } catch (_) {
        const input = document.createElement('textarea');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        const ok = document.execCommand('copy');
        input.remove();
        return ok ? '共有テキストをコピーしました' : 'コピーできませんでした';
      }
    };
    window.kangoshiSharePng = async function (base64) {
      const dataUrl = 'data:image/png;base64,' + base64;
      const binary = atob(base64);
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      const file = new File([bytes], 'kangoshi-quest.png', {type: 'image/png'});
      if (navigator.share && navigator.canShare && navigator.canShare({files: [file]})) {
        try {
          await navigator.share({files: [file]});
          return '画像を共有しました';
        } catch (e) {
          if (e.name === 'AbortError') return '共有をキャンセルしました';
        }
      }
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = 'kangoshi-quest.png';
      document.body.appendChild(link);
      link.click();
      link.remove();
      return '画像を保存しました';
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
